---
# cspell:words hitsofcode
name: hitsofcode

'on':
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild_cache:
    name: Rebuild Hits-of-Code cache
    runs-on: ubuntu-latest
    steps:
      - name: Clear Hits-of-Code cache
        run: |
          curl --fail --silent --show-error \
            --request POST \
            # yamllint disable-line rule:line-length
            'https://hitsofcode.com/github/earthquakeonmars/ssh-tunnel/delete?exclude=' \
            --output /dev/null

      - name: Trigger Hits-of-Code rebuild
        run: |
          curl --fail --silent --show-error \
            # yamllint disable-line rule:line-length
            'https://hitsofcode.com/github/earthquakeonmars/ssh-tunnel/json?exclude=' \
            --output /dev/null
